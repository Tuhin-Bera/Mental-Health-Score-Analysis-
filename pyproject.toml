[project]
name = "part-1"
version = "0.1.0"
description = "Mental health signal prediction app"
readme = "README.md"
authors = [
    { name = "Tuhin_Bera", email = "125761605+02TuhinBera@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.1",
    "pandas==2.2.3",
    "joblib==1.4.2",
    "scikit-learn==1.6.1",
    "pydantic==2.10.6",
    "httpx==0.28.1",
]

[project.scripts]
part-1 = "main:run"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
